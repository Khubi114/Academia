# Builds an installable Android APK.
# Run it from GitHub: Actions → "Build Android APK" → Run workflow,
# then download the "academia-apk" artifact from the finished run.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/affectionate-bell-p2ey1b]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Public defaults live in lib/core/app_config.dart. Override any of them
      # with --dart-define=KEY=value if needed (never put secrets here).
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: academia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
